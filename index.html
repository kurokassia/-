<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь Альфа</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background: #fff;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        align-items: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ed 100%);
    }

    .calendar-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    /* Заголовок */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }
    .month {
        font-size: 26px;
        font-weight: 700;
        color: #333;
    }
    .arrow {
        font-size: 22px;
        padding: 8px 12px;
        cursor: pointer;
        user-select: none;
        transition: 0.2s;
        border-radius: 8px;
    }
    .arrow:hover { 
        background: rgba(239, 49, 36, 0.12); 
        color: #EF3124; 
    }

    /* Сетка */
    .weekdays, .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        gap: 4px;
    }

    .weekdays div {
        font-weight: 600;
        color: #777;
        margin-bottom: 8px;
        padding: 8px 0;
    }

    .days div {
        padding: 12px 0;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        position: relative;
        margin: 2px;
    }
    .days div:hover {
        background: rgba(239, 49, 36, 0.12);
    }

    /* Индикатор мероприятия */
    .event-dot {
        width: 6px;
        height: 6px;
        background: #EF3124;
        border-radius: 50%;
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Сегодня */
    .today {
        background: #EF3124;
        color: #fff;
        font-weight: 700;
    }
    
    /* Выбранный день */
    .selected {
        background: rgba(239, 49, 36, 0.15);
        color: #EF3124;
        font-weight: 600;
    }

    /* Блок событий */
    .event-box {
        margin-top: 25px;
        padding: 15px;
        border-radius: 12px;
        background: #f7f7f7;
        border-left: 4px solid #EF3124;
        display: none;
        animation: fadeIn .3s ease;
    }

    .event-box h3 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #333;
    }

    .event-item {
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
        color: #555;
    }
    
    .event-item:last-child {
        border-bottom: none;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    
    /* Дни из других месяцев */
    .other-month {
        color: #ccc;
    }
</style>
</head>

<body>

<div class="calendar-container">

    <div class="header">
        <div class="arrow" id="prev">←</div>
        <div class="month" id="monthName"></div>
        <div class="arrow" id="next">→</div>
    </div>

    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="days" id="days"></div>

    <div class="event-box" id="eventBox">
        <h3 id="eventDateTitle"></h3>
        <div id="eventsList"></div>
    </div>

</div>

<script>
/* --- МЕРОПРИЯТИЯ --- */
const events = {
    "2025-01-05": ["Митап по инвестициям", "Онлайн-встреча «Финансы в 20»"],
    "2025-01-14": ["Совещание команды", "Разбор новых фич"],
    "2025-01-21": ["Вебинар: Как копить правильно"],
    "2025-02-02": ["День открытых дверей"],
    "2025-02-14": ["Встреча с партнерами"],
    "2025-02-20": ["Презентация проекта"],
};

const monthName = document.getElementById("monthName");
const daysContainer = document.getElementById("days");
const eventBox = document.getElementById("eventBox");
const eventDateTitle = document.getElementById("eventDateTitle");
const eventsList = document.getElementById("eventsList");

let date = new Date();
let selectedDate = null;

function renderCalendar() {
    const year = date.getFullYear();
    const month = date.getMonth();

    const months = [
        "Январь","Февраль","Март","Апрель","Май","Июнь",
        "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
    ];

    monthName.textContent = `${months[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    // Корректировка для понедельника как первого дня недели
    const start = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    daysContainer.innerHTML = "";

    // Добавляем дни предыдущего месяца
    for (let i = start; i > 0; i--) {
        const prevDay = document.createElement("div");
        prevDay.textContent = prevLastDate - i + 1;
        prevDay.classList.add("other-month");
        daysContainer.appendChild(prevDay);
    }

    // Добавляем дни текущего месяца
    for (let day = 1; day <= lastDate; day++) {
        const d = document.createElement("div");
        d.textContent = day;

        const today = new Date();
        if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            d.classList.add("today");
        }

        // Проверка на выбранную дату
        if (selectedDate && 
            day === selectedDate.getDate() && 
            month === selectedDate.getMonth() && 
            year === selectedDate.getFullYear()) {
            d.classList.add("selected");
        }

        // Проверка на событие
        const key = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        if (events[key]) {
            const dot = document.createElement("div");
            dot.classList.add("event-dot");
            d.appendChild(dot);

            d.onclick = () => {
                // Убираем выделение с предыдущей выбранной даты
                const prevSelected = document.querySelector('.selected');
                if (prevSelected && !prevSelected.classList.contains('today')) {
                    prevSelected.classList.remove('selected');
                }
                
                // Добавляем выделение к новой дате
                if (!d.classList.contains('today')) {
                    d.classList.add('selected');
                }
                
                selectedDate = new Date(year, month, day);
                showEvents(key, events[key]);
            };
        } else {
            d.onclick = () => {
                // Убираем выделение с предыдущей выбранной даты
                const prevSelected = document.querySelector('.selected');
                if (prevSelected && !prevSelected.classList.contains('today')) {
                    prevSelected.classList.remove('selected');
                }
                
                // Добавляем выделение к новой дате
                if (!d.classList.contains('today')) {
                    d.classList.add('selected');
                }
                
                selectedDate = new Date(year, month, day);
                hideEvents();
            };
        }

        daysContainer.appendChild(d);
    }

    // Добавляем дни следующего месяца
    const totalCells = 42; // 6 строк * 7 дней
    const daysAdded = start + lastDate;
    const remainingDays = totalCells - daysAdded;
    
    for (let i = 1; i <= remainingDays; i++) {
        const nextDay = document.createElement("div");
        nextDay.textContent = i;
        nextDay.classList.add("other-month");
        daysContainer.appendChild(nextDay);
    }
}

function showEvents(dateKey, eventList) {
    eventDateTitle.textContent = formatDate(dateKey);
    eventsList.innerHTML = "";

    eventList.forEach(ev => {
        const item = document.createElement("div");
        item.classList.add("event-item");
        item.textContent = "• " + ev;
        eventsList.appendChild(item);
    });

    eventBox.style.display = "block";
}

function hideEvents() {
    eventBox.style.display = "none";
}

function formatDate(dateStr) {
    const [y, m, d] = dateStr.split("-");
    const months = ["января", "февраля", "марта", "апреля", "мая", "июня", 
                   "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

document.getElementById("prev").onclick = () => {
    date.setMonth(date.getMonth() - 1);
    renderCalendar();
    hideEvents();
};

document.getElementById("next").onclick = () => {
    date.setMonth(date.getMonth() + 1);
    renderCalendar();
    hideEvents();
};

// Инициализация календаря
renderCalendar();
</script>

</body>
</html>
